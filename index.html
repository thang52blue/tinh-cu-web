<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UA Tycoon — Trở thành UA Manager huyền thoại</title>
  <meta name="description" content="Quản lý ngân sách, chạy campaign, scale app từ 0 lên 1 triệu users. Bạn có làm được không?" />
  <meta name="theme-color" content="#0f0f1a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100dvh;
      background: #0f0f1a; color: #e8e4f0;
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .btn {
      border: 0; border-radius: 999px; padding: 11px 20px;
      font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
      color: #0f0f1a; background: #7c5cfc;
    }
    .blocked p { color: #6b6580; font-size: 15px; line-height: 1.5; margin-top: 12px; }
    .game-frame { width: 100%; height: 100dvh; border: 0; display: none; }
  </style>
</head>
<body>

  <div id="blocked">
    <div>
      <h1 style="font-size:22px">📍</h1>
      <p>Để chơi game bạn cần bật vị trí</p>
    </div>
  </div>

  <iframe class="game-frame" id="gameFrame" src="ua-tycoon.html"></iframe>

  <script>
    const ua = navigator.userAgent;
    const isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua);
    const isInApp = /Instagram|FBAN|FBAV|Zalo|Messenger|Line|TikTok|Snapchat/i.test(ua);

    if (!isMobile) {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100dvh;text-align:center;padding:24px">'
        + '<div><h1 style="font-size:22px;margin-bottom:12px">📱 Mở trên điện thoại nhé!</h1>'
        + '<p style="color:#6b6580;font-size:15px;line-height:1.5">Trang này chỉ xem được trên điện thoại.<br>Hãy quét mã QR hoặc mở link trên điện thoại của bạn.</p></div></div>';
    } else if (isInApp) {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100dvh;text-align:center;padding:24px">'
        + '<div><h1 style="font-size:40px;margin-bottom:16px">🔗</h1>'
        + '<p style="color:#e8e4f0;font-size:17px;font-weight:600;margin-bottom:8px">Mở bằng Safari để chơi game</p>'
        + '<p style="color:#6b6580;font-size:15px;line-height:1.8;margin-bottom:20px">'
        + 'Bấm vào <b style="color:#7c5cfc"> ⋯ </b> hoặc <b style="color:#7c5cfc"> ᐧᐧᐧ </b> ở góc phải<br>rồi chọn <b style="color:#7c5cfc">"Open in Safari"</b></p>'
        + '<button class="btn" id="copyBtn">📋 Copy link</button>'
        + '<p style="color:#6b6580;font-size:13px;margin-top:12px">Hoặc copy link rồi dán vào Safari</p></div></div>';
      document.getElementById("copyBtn").addEventListener("click", function() {
        navigator.clipboard.writeText(location.href).then(() => { this.textContent = "✅ Đã copy!"; });
      });
    } else {
      document.getElementById("blocked").style.display = "none";
      const frame = document.getElementById("gameFrame");
      frame.style.display = "block";
      document.body.style.padding = "0";
    }
  </script>
</body>
</html>
